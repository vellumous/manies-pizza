<!DOCTYPE html>
<html>

<head>
    <title>Manies — Screen 1</title>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: system-ui, sans-serif;
            padding: 40px;
            max-width: 800px;
        }

        h2 {
            font-size: 24px;
            margin-top: 30px;
            color: #fff;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        p {
            font-size: 20px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div id="menu">Loading...</div>

    <script>
        let DATA_URL = 'https://script.google.com/macros/s/AKfycbz5x09euHblxsHFZ1Fj51m0zRLzBdy1tm8RQUL1oC6WB2oU3ADnSmcCQmmNiUdZx2WO/exec'

        fetch(DATA_URL)
            .then(function (response) {
                return response.json();
            })
            .then(function (items) {
                var html = '';
                var currentSection = '';

                for (var i = 0; i < items.length; i++) {
                    var item = items[i];

                    if (item.section !== currentSection) {
                        currentSection = item.section;
                        html += '<h2>' + currentSection + '</h2>';
                    }

                    html += '<p>' + item.name + ' — ' + item.price + '</p>';
                }

                document.getElementById('menu').innerHTML = html;
            })
            .catch(function (err) {
                document.getElementById('menu').textContent = 'Error: ' + err.message;
            });
    </script>
</body>

</html>
