<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#313131" />
  <title>Manies Pizza</title>
  <link rel="icon" type="image/png" sizes="192x192" href="img/icon-192.png" />
  <script src="lib/gsap.min.js"></script>
  <link rel="stylesheet" href="css/fonts.css" />
  <link rel="stylesheet" href="css/site.css" />
</head>
<body>
  <div id="splash">
    <div class="splash-logo" id="splash-logo"><img src="img/logo-trans.png" alt="" /></div>
    <div class="splash-bar"><span id="splash-fill"></span></div>
    <div class="splash-meta">
      <div class="splash-tag">Manies Pizza &amp; Grill </div>
      <div class="splash-copy">Lekker Since 2022</div>
      <div class="splash-version">v01.20</div>
    </div>
  </div>

  <div id="views">
    <section id="home" class="view"></section>
    <section id="about" class="view" style="display:none"></section>
    <section id="menu" class="view spacious" style="display:none"></section>
  </div>

  <div class="cart" id="cart">
    <div class="cart-toggle" id="cart-toggle">
      <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 30 30" style="margin: 5px 0 0 8px;">
        <path d="M6.665 9.068l-3.665-1.66v14l3.665 2.592 14.335-2.155v-14.845l-14.335 2.068zm-1.665 1.441l1 .453v10.118l-1-.707v-9.864zm14 9.615l-11 1.653v-10.881l11-1.587v10.815zm-2-15.833l-.001 1.749c0 .246-.18.455-.423.492-.303.045-.576-.19-.576-.495v-1.746c.001-.691-.231-1.304-.653-1.726-.368-.37-.847-.565-1.384-.565-1.547 0-2.96 1.558-2.963 3.268v1.681c0 .247-.181.457-.425.494-.302.046-.575-.189-.575-.494l.001-1.683c.004-2.261 1.866-4.266 3.962-4.266 1.717 0 3.039 1.387 3.037 3.291zm-9.999 2.209v-2.235c.004-2.26 1.866-4.265 3.962-4.265.492 0 .944.125 1.35.332-.423.17-.822.4-1.188.683l-.162-.015c-1.547 0-2.961 1.558-2.963 3.268v2.232c0 .248-.182.458-.427.494-.3.045-.572-.187-.572-.494z"></path>
      </svg>
      <span class="cart-count" id="cart-count">0</span>
    </div>
    <div id="cart-items" class="cart-summary">
      <div class="empty-cart">Your cart is empty</div>
    </div>
    <div class="cart-store">
      <input type="radio" id="store1" name="store" value="27628859986" checked /><label for="store1">Grassy Park</label>
      <input type="radio" id="store2" name="store" value="27616202816" /><label for="store2">Rondebosch East</label>
    </div>
    <div class="cart-bottom" id="cart-bottom">
      <div class="cart-total">
        <span class="cart-total-label">Total</span>
        <div class="cart-total-amount">
          <span class="cart-total-currency">R</span><span id="total-amount">0</span>
        </div>
      </div>
      <button id="whatsapp-btn" class="whatsapp-btn"><img src="img/wa.svg" alt="" />Order</button>
    </div>
  </div>

  <div class="dim" id="dim"></div>

  <img src="img/logo-trans.png" alt="Manies Pizza Logo" class="thumb-logo" id="thumb-logo" width="120" />

  <nav>
    <div class="pill" id="pill"></div>
    <div class="tab active" data-view="home"><img src="img/pizza_1.svg" class="thumb-size" style="transform: rotate3d(1, 1, 15, 180deg);" /></div>
    <div class="tab" data-view="menu"><img src="img/res-menu.svg" class="thumb-size" /></div>
  </nav>

  <script type="module" src="js/app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js"));
    }
  </script>
</body>
</html>
